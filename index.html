    <meta name="theme-color" content="#09090b" />

    <!--
      Theme boot. Runs before the first paint so the page never renders in one
      palette and then snaps to the other. The stored preference wins; with
      none stored we follow the OS. Kept in step with src/hooks/use-theme.ts,
      which owns the same logic once React is up.

      The document ships with class="dark", so a visitor with JavaScript off
      still gets a coherent page rather than an unstyled one.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#09090b' : '#f3f4f6');
          document
            .querySelector('meta[name="color-scheme"]')
            .setAttribute('content', dark ? 'dark' : 'light');
        } catch (e) {
          /* Storage or matchMedia unavailable: keep the shipped default. */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
